<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>متجر وِدّ🛍️ | لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --primary-color:#d4a373;--primary-dark:#bd8f62;
  --text-dark:#333;--text-light:#fff;--pink-soft:#fbc4ab;
  --bg-color:#faf9f6;--border-color:#e2d4c9;
  --danger-color:#e56b6f;--success-color:#2a9d8f;
  --warning-color:#f4a261;--info-color:#4a90e2;--whatsapp:#25d366;
  --card-bg:#fff;--shadow-sm:0 2px 8px rgba(0,0,0,.05);
  --shadow-md:0 4px 15px rgba(0,0,0,.08);--shadow-lg:0 15px 40px rgba(0,0,0,.12);
  --radius:14px;--ease:cubic-bezier(.22,1,.36,1);
}
body.dark-mode{
  --text-dark:#f0e5d8;--bg-color:#1a1410;--border-color:#3a2d22;
  --card-bg:#241a13;--text-light:#241a13;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background-color:var(--bg-color);color:var(--text-dark);line-height:1.5;overflow-x:hidden;transition:background .3s,color .3s}
input,select,textarea,button{font-family:inherit}

header{background-color:var(--card-bg);box-shadow:var(--shadow-sm);border-bottom:1px solid var(--border-color);padding:12px 16px;position:sticky;top:0;z-index:1000}
.nav-container{width:100%;max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:1rem;font-weight:900;color:var(--primary-color);white-space:nowrap;font-family:'Amiri',serif}
.nav-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-nav{background-color:var(--primary-color);border:none;padding:8px 14px;border-radius:20px;font-weight:700;color:#fff;cursor:pointer;transition:.3s;font-size:.8rem;white-space:nowrap;display:flex;align-items:center;gap:5px}
.btn-nav:hover{background-color:var(--primary-dark);transform:translateY(-2px)}
.btn-icon-nav{background:var(--bg-color);border:1px solid var(--border-color);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:1rem;transition:.3s}
.btn-icon-nav:hover{border-color:var(--primary-color);transform:scale(1.1)}
.badge-count{background:#fff;color:var(--primary-color);border-radius:10px;padding:1px 7px;font-size:.7rem;font-weight:900;margin-inline-start:4px}

.stats-grid{width:100%;max-width:1200px;margin:16px auto;padding:0 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .3s}
.stat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.stat-icon{font-size:1.8rem;margin-bottom:8px}
.stat-label{font-size:.75rem;color:#888;font-weight:700;margin-bottom:4px}
.stat-value{font-size:1.5rem;font-weight:900;color:var(--primary-color);font-family:'Amiri',serif}
.stat-card::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary-color)}
.stat-card.green::before{background:var(--success-color)}
.stat-card.green .stat-value{color:var(--success-color)}
.stat-card.blue::before{background:var(--info-color)}
.stat-card.blue .stat-value{color:var(--info-color)}
.stat-card.orange::before{background:var(--warning-color)}
.stat-card.orange .stat-value{color:var(--warning-color)}

.admin-container{width:100%;max-width:1200px;margin:0 auto;padding:16px 12px;display:grid;grid-template-columns:1fr 1.8fr;gap:16px}
@media(max-width:900px){.admin-container{grid-template-columns:1fr;padding:12px 10px}}

.card{background:var(--card-bg);padding:16px;border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border-color);height:fit-content;margin-bottom:16px;width:100%}
.card h2{font-size:1rem;color:var(--text-dark);margin-bottom:14px;font-weight:900;border-bottom:2px solid var(--bg-color);padding-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-family:'Amiri',serif}

.collapsible-header{cursor:pointer;user-select:none;transition:.2s}
.collapsible-header:hover{color:var(--primary-color)}
.arrow-icon{transition:transform .3s;font-size:.85rem}
.collapsible-content{max-height:0;overflow:hidden;transition:max-height .35s ease-out}
.collapsible-content.open{max-height:3000px;transition:max-height .4s ease-in}

.form-group{margin-bottom:12px;width:100%}
.form-group label{display:block;margin-bottom:4px;font-weight:700;font-size:.8rem;color:var(--text-dark)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border-color);border-radius:8px;font-size:.9rem;outline:none;transition:.3s;resize:vertical;background:var(--card-bg);color:var(--text-dark)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(212,163,115,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.checkbox-group{display:flex;align-items:center;gap:8px;background:var(--bg-color);padding:8px 10px;border-radius:8px;border:1.5px solid var(--border-color);margin-top:4px;width:100%}
.checkbox-group input{width:18px;height:18px;cursor:pointer;accent-color:var(--primary-color);flex-shrink:0}
.checkbox-group label{margin-bottom:0;cursor:pointer;font-weight:700;color:var(--text-dark);font-size:.82rem}

.social-box-item{background:var(--bg-color);padding:10px;border-radius:10px;border:1px solid var(--border-color);margin-bottom:10px}

.btn-submit{width:100%;background-color:var(--primary-color);color:#fff;border:none;padding:11px;border-radius:8px;font-weight:900;cursor:pointer;transition:.3s;font-size:.9rem;margin-top:4px}
.btn-submit:hover{background-color:var(--primary-dark)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}

.btn-danger-sm{background-color:var(--danger-color);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.btn-danger-sm:hover{opacity:.85;transform:scale(1.05)}
.btn-call-sm{background-color:var(--success-color);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap;transition:.2s}
.btn-call-sm:hover{opacity:.85;transform:scale(1.05)}
.btn-whatsapp-sm{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;transition:.2s;box-shadow:0 2px 6px rgba(37,211,102,.3)}
.btn-whatsapp-sm:hover{opacity:.9;transform:scale(1.05);box-shadow:0 4px 12px rgba(37,211,102,.4)}
.btn-whatsapp-confirm{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:.8rem;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.2s;box-shadow:0 3px 10px rgba(37,211,102,.35);width:100%;justify-content:center}
.btn-whatsapp-confirm:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(37,211,102,.5)}
.btn-edit-sm{background-color:var(--info-color);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-edit-sm:hover{opacity:.85}

.table-responsive{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
table{width:100%;border-collapse:collapse;text-align:right;font-size:.85rem;min-width:100%}
th,td{padding:10px 8px;border-bottom:1px solid var(--border-color);vertical-align:middle;word-break:break-word}
th{background-color:var(--bg-color);color:var(--text-dark);font-weight:900;white-space:nowrap;font-size:.78rem}
tr:hover td{background:rgba(212,163,115,.04)}

.product-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#eee;display:grid;place-items:center;font-size:.9rem;flex-shrink:0}
.order-badge{background-color:var(--pink-soft);color:#582f0e;padding:3px 8px;border-radius:8px;font-size:.75rem;font-weight:700;margin-bottom:3px;display:inline-block;margin-inline-end:3px}

.status-badge{padding:3px 10px;border-radius:8px;font-size:.72rem;font-weight:900;display:inline-block}
.status-confirmed{background:#dbeafe;color:#1e40af}
.status-shipped{background:#fed7aa;color:#9a3412}
.status-delivered{background:#d1fae5;color:#065f46}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:2000;padding:10px}
.overlay.open{display:flex}
.modal-box{background:var(--card-bg);border-radius:var(--radius);width:100%;max-width:1100px;max-height:88vh;display:flex;flex-direction:column;padding:16px;box-shadow:var(--shadow-lg);border:1px solid var(--border-color);animation:fadeIn .25s ease}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--bg-color);padding-bottom:10px;margin-bottom:10px;gap:8px;flex-shrink:0;flex-wrap:wrap}
.modal-header h2{font-size:1.05rem;color:var(--text-dark);font-weight:900;margin-bottom:0;border:none;padding:0;font-family:'Amiri',serif}
.modal-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn-close-modal{background-color:var(--bg-color);border:1px solid var(--border-color);padding:6px 12px;border-radius:8px;font-weight:900;cursor:pointer;font-size:.8rem;color:var(--text-dark);white-space:nowrap}
.btn-close-modal:hover{background-color:var(--border-color)}
.modal-body-scroll{flex:1;overflow-y:auto;width:100%}

.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar input,.filter-bar select{flex:1;min-width:140px;padding:8px 12px;border:1.5px solid var(--border-color);border-radius:8px;font-size:.85rem;background:var(--card-bg);color:var(--text-dark)}
.filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:var(--primary-color)}

.mobile-cards{display:none}
@media(max-width:640px){
  .desktop-table{display:none}
  .mobile-cards{display:block}
  .mobile-card{background:var(--bg-color);border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid var(--border-color)}
  .mobile-card-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.82rem;border-bottom:1px dashed var(--border-color)}
  .mobile-card-row:last-child{border-bottom:none}
  .mobile-card-row strong{color:var(--primary-color)}
  .mobile-card-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
}

.toast-notification{position:fixed;bottom:16px;right:16px;left:16px;max-width:350px;margin:0 auto;background:var(--success-color);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-md);display:none;z-index:3000;font-weight:700;font-size:.85rem;text-align:center;animation:slideUp .3s}
.toast-notification.show{display:block}
.toast-notification.error{background:var(--danger-color)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.image-previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:8px}
.image-preview{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid var(--border-color)}
.image-preview img{width:100%;height:100%;object-fit:cover}
.image-preview .remove-img{position:absolute;top:2px;right:2px;background:var(--danger-color);color:#fff;border:none;width:20px;height:20px;border-radius:50%;font-size:.7rem;cursor:pointer;display:grid;place-items:center}

@media(max-width:640px){
  .form-row{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-value{font-size:1.2rem}
  .stat-icon{font-size:1.4rem}
}
</style>
</head>
<body>

<header>
  <div class="nav-container">
    <div class="logo">متجر وِدّ🛍️ - لوحة التحكم</div>
    <div class="nav-actions">
      <button class="btn-icon-nav" id="themeToggle" title="الوضع الليلي">🌙</button>
      <button id="openOrdersBtn" class="btn-nav">🛍️ الطلبات <span class="badge-count" id="ordersCount">0</span></button>
    </div>
  </div>
</header>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-icon">💐</div>
    <div class="stat-label">المنتجات</div>
    <div class="stat-value" id="statProducts">0</div>
  </div>
  <div class="stat-card green">
    <div class="stat-icon">🛍️</div>
    <div class="stat-label">الطلبات</div>
    <div class="stat-value" id="statOrders">0</div>
  </div>
  <div class="stat-card blue">
    <div class="stat-icon">💰</div>
    <div class="stat-label">الإيرادات</div>
    <div class="stat-value" id="statRevenue">0</div>
  </div>
  <div class="stat-card orange">
    <div class="stat-icon">👥</div>
    <div class="stat-label">العملاء</div>
    <div class="stat-value" id="statCustomers">0</div>
  </div>
</div>

<div class="admin-container">
  <div>
    <div class="card">
      <h2>➕ <span id="formTitle">إضافة منتج جديد</span></h2>
      <form id="productForm">
        <input type="hidden" id="editProductId" value="">
        <div class="form-group">
          <label>اسم المنتج:</label>
          <input type="text" id="pName" required placeholder="مثال: باقة ورد جوري">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>السعر (جنيه):</label>
            <input type="number" id="pPrice" step="0.1" required placeholder="0.00">
          </div>
          <div class="form-group">
            <label>الخصم %:</label>
            <input type="number" id="pDiscount" min="0" max="100" placeholder="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>التصنيف:</label>
            <select id="pCategory">
              <option value="">بدون تصنيف</option>
              <option value="أعراس">أعراس</option>
              <option value="أعياد ميلاد">أعياد ميلاد</option>
              <option value="تعازي">تعازي</option>
              <option value="تخرج">تخرج</option>
              <option value="مولود جديد">مولود جديد</option>
              <option value="تحف فنية">تحف فنية</option>
            </select>
          </div>
          <div class="form-group">
            <label>التقييم (0-5):</label>
            <input type="number" id="pRating" step="0.1" min="0" max="5" placeholder="4.5">
          </div>
        </div>
        <div class="form-group">
          <label>صورة المنتج (حتى 5 صور):</label>
          <input type="file" id="pImage" accept="image/*" multiple>
          <div class="image-previews" id="imagePreviews"></div>
        </div>
        <div class="form-group">
          <label>ملاحظات وتفاصيل المنتج:</label>
          <textarea id="pDesc" rows="2" placeholder="اكتب التفاصيل هنا..."></textarea>
        </div>
        <div class="form-group">
          <label>وقت انتهاء العرض (اختياري):</label>
          <input type="datetime-local" id="pOfferEnds">
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" id="pShowDesc" checked>
          <label for="pShowDesc">إظهار الملاحظات للعملاء</label>
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" id="pInStock" checked>
          <label for="pInStock">المنتج متوفر في المخزون</label>
        </div>
        <button type="submit" class="btn-submit" id="saveBtn">حفظ ونشر المنتج</button>
        <button type="button" class="btn-submit" id="cancelEditBtn" style="display:none;background:#999;margin-top:6px">إلغاء التعديل</button>
      </form>
    </div>

    <div class="card">
      <h2 class="collapsible-header" id="socialToggleHeader">
        <span>🔗 روابط وقنوات التواصل</span>
        <span class="arrow-icon" id="arrowIcon">▼</span>
      </h2>
      <div class="collapsible-content" id="socialCollapsibleContent">
        <form id="socialForm" style="margin-top:10px">
          <div class="social-box-item">
            <div class="form-group" style="margin-bottom:6px">
              <label>💬 رقم أو رابط واتساب:</label>
              <input type="text" id="sWhatsapp" placeholder="https://wa.me/2010XXXXXXXX">
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="sWhatsappActive">
              <label for="sWhatsappActive">إظهار زر واتساب</label>
            </div>
          </div>
          <div class="social-box-item">
            <div class="form-group" style="margin-bottom:6px">
              <label>📸 رابط إنستجرام:</label>
              <input type="text" id="sInstagram" placeholder="https://instagram.com/...">
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="sInstagramActive">
              <label for="sInstagramActive">إظهار زر إنستجرام</label>
            </div>
          </div>
          <div class="social-box-item">
            <div class="form-group" style="margin-bottom:6px">
              <label>🎬 رابط تيك توك:</label>
              <input type="text" id="sTiktok" placeholder="https://tiktok.com/@...">
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="sTiktokActive">
              <label for="sTiktokActive">إظهار زر تيك توك</label>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="saveSocialBtn">حفظ إعدادات الروابط</button>
        </form>
      </div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2 class="collapsible-header" id="productsToggleHeader">
        <span>💐 المنتجات الحالية</span>
        <span class="arrow-icon" id="productsArrowIcon">▼</span>
      </h2>
      <div class="collapsible-content open" id="productsCollapsibleContent" style="margin-top:10px">
        <div class="table-responsive desktop-table">
          <table>
            <thead>
              <tr>
                <th>الصورة</th>
                <th>الاسم</th>
                <th>السعر</th>
                <th>الخصم</th>
                <th>المخزون</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="adminProductsTable">
              <tr><td colspan="6" style="text-align:center">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="mobile-cards" id="adminProductsMobile"></div>
      </div>
    </div>
  </div>
</div>

<div id="ordersModalOverlay" class="overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2>🛍️ الطلبات الواردة</h2>
      <div class="modal-actions">
        <button id="clearAllOrdersBtn" class="btn-danger-sm">مسح الكل</button>
        <button id="closeOrdersBtn" class="btn-close-modal">إغلاق ❌</button>
      </div>
    </div>
    <div class="filter-bar">
      <input type="text" id="searchOrders" placeholder="🔍 بحث بالاسم أو الهاتف...">
      <select id="filterStatus">
        <option value="">كل الحالات</option>
        <option value="confirmed">تأكيد</option>
        <option value="shipped">جاري التوصيل</option>
        <option value="delivered">تم التوصيل</option>
      </select>
    </div>
    <div class="modal-body-scroll">
      <div class="table-responsive desktop-table">
        <table>
          <thead>
            <tr>
              <th>العميل</th>
              <th>الهاتف</th>
              <th>المنتجات</th>
              <th>الإجمالي</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="adminOrdersTable">
            <tr><td colspan="6" style="text-align:center">لا توجد طلبات...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="mobile-cards" id="adminOrdersMobile"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast-notification"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, getDocs, setDoc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5zYCIsEwHW3BhSrco2At8oAx65VflI_A",
  authDomain: "store-fb47c.firebaseapp.com",
  projectId: "store-fb47c",
  storageBucket: "store-fb47c.firebasestorage.app",
  messagingSenderId: "24638171506",
  appId: "1:24638171506:web:10af528f2fc5bdf27a95eb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let allProducts = [];
let allOrders = [];
let uploadedImages = [];
let previousOrdersCount = 0;
let isFirstLoad = true;

function showToast(msg, type='success'){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast-notification show ' + (type === 'error' ? 'error' : '');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function playNotificationSound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  } catch(e){}
}

function setupCollapsible(headerId, contentId, arrowId, openByDefault = false){
  const header = $(headerId), content = $(contentId), arrow = $(arrowId);
  if (openByDefault){
    content.classList.add('open');
    arrow.style.transform = 'rotate(180deg)';
  }
  header.addEventListener('click', () => {
    content.classList.toggle('open');
    arrow.style.transform = content.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0)';
  });
}

function compressImage(file, maxWidth = 700, quality = 0.72){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = ev => {
      const img = new Image();
      img.src = ev.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
    };
  });
}

$('pImage').addEventListener('change', async e => {
  const files = Array.from(e.target.files).slice(0, 5);
  uploadedImages = [];
  for (const f of files){
    uploadedImages.push(await compressImage(f));
  }
  renderImagePreviews();
});

function renderImagePreviews(){
  $('imagePreviews').innerHTML = uploadedImages.map((img, i) => `
    <div class="image-preview">
      <img src="${img}" alt="">
      <button type="button" class="remove-img" onclick="removeImage(${i})">✕</button>
    </div>
  `).join('');
}
window.removeImage = (i) => {
  uploadedImages.splice(i, 1);
  renderImagePreviews();
};

$('productForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = "جاري الحفظ...";

  const editId = $('editProductId').value;
  const name = $('pName').value.trim();
  const price = parseFloat($('pPrice').value) || 0;
  const discount = parseInt($('pDiscount').value) || 0;
  const category = $('pCategory').value;
  const rating = parseFloat($('pRating').value) || 0;
  const description = $('pDesc').value.trim();
  const showDesc = $('pShowDesc').checked;
  const inStock = $('pInStock').checked;
  const offerEndsVal = $('pOfferEnds').value;

  const data = {
    name, price, discount, category, rating,
    description: showDesc ? description : '',
    image: uploadedImages[0] || '',
    images: uploadedImages,
    inStock,
    offerEndsAt: offerEndsVal ? new Date(offerEndsVal) : null
  };

  try {
    if (editId){
      await updateDoc(doc(db, "products", editId), { ...data, updatedAt: serverTimestamp() });
      showToast("✅ تم تحديث المنتج");
    } else {
      await addDoc(collection(db, "products"), { ...data, timestamp: serverTimestamp() });
      showToast("✅ تم نشر المنتج");
    }
    resetForm();
  } catch(e){
    console.error(e);
    showToast("❌ خطأ، حاول مجددًا", "error");
  } finally {
    $('saveBtn').disabled = false;
    $('saveBtn').textContent = "حفظ ونشر المنتج";
  }
});

function resetForm(){
  $('productForm').reset();
  $('editProductId').value = '';
  uploadedImages = [];
  renderImagePreviews();
  $('pShowDesc').checked = true;
  $('pInStock').checked = true;
  $('formTitle').textContent = 'إضافة منتج جديد';
  $('saveBtn').textContent = 'حفظ ونشر المنتج';
  $('cancelEditBtn').style.display = 'none';
}

$('cancelEditBtn').addEventListener('click', resetForm);

onSnapshot(query(collection(db, "products"), orderBy("timestamp", "desc")), snap => {
  allProducts = [];
  snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
  renderProducts();
  updateStats();
});

function renderProducts(){
  if (!allProducts.length){
    $('adminProductsTable').innerHTML = `<tr><td colspan="6" style="text-align:center">لا توجد منتجات</td></tr>`;
    $('adminProductsMobile').innerHTML = `<div style="text-align:center;padding:20px;color:#888">لا توجد منتجات</div>`;
    return;
  }

  $('adminProductsTable').innerHTML = allProducts.map(p => {
    const thumb = p.image ? `<img src="${p.image}" class="product-thumb">` : `<div class="product-thumb">💐</div>`;
    const stock = p.inStock === false ? `<span class="status-badge status-shipped">نفذت</span>` : `<span class="status-badge status-delivered">متوفر</span>`;
    return `<tr>
      <td>${thumb}</td>
      <td><strong>${escapeHtml(p.name || '')}</strong>${p.category ? `<br><small style="color:#888">${escapeHtml(p.category)}</small>` : ''}</td>
      <td>${p.price}ج</td>
      <td>${p.discount > 0 ? `<span style="color:var(--danger-color)">${p.discount}%</span>` : '-'}</td>
      <td>${stock}</td>
      <td>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn-edit-sm" onclick="editProduct('${p.id}')">✏️</button>
          <button class="btn-danger-sm" onclick="deleteProduct('${p.id}')">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  $('adminProductsMobile').innerHTML = allProducts.map(p => {
    const thumb = p.image ? `<img src="${p.image}" class="product-thumb" style="width:50px;height:50px">` : `<div class="product-thumb" style="width:50px;height:50px">💐</div>`;
    const stock = p.inStock === false ? '❌ نفذت' : '✅ متوفر';
    return `<div class="mobile-card">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
        ${thumb}
        <div style="flex:1">
          <strong style="color:var(--primary-color)">${escapeHtml(p.name || '')}</strong>
          ${p.category ? `<br><small style="color:#888">${escapeHtml(p.category)}</small>` : ''}
        </div>
      </div>
      <div class="mobile-card-row"><span>السعر:</span><strong>${p.price}ج</strong></div>
      <div class="mobile-card-row"><span>الخصم:</span><strong>${p.discount > 0 ? p.discount + '%' : '-'}</strong></div>
      <div class="mobile-card-row"><span>المخزون:</span><strong>${stock}</strong></div>
      <div class="mobile-card-actions">
        <button class="btn-edit-sm" onclick="editProduct('${p.id}')">✏️ تعديل</button>
        <button class="btn-danger-sm" onclick="deleteProduct('${p.id}')">🗑️ حذف</button>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

window.editProduct = (id) => {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  $('editProductId').value = id;
  $('pName').value = p.name || '';
  $('pPrice').value = p.price || '';
  $('pDiscount').value = p.discount || 0;
  $('pCategory').value = p.category || '';
  $('pRating').value = p.rating || '';
  $('pDesc').value = p.description || '';
  $('pShowDesc').checked = !!p.description;
  $('pInStock').checked = p.inStock !== false;
  uploadedImages = p.images || (p.image ? [p.image] : []);
  renderImagePreviews();
  $('formTitle').textContent = 'تعديل المنتج';
  $('saveBtn').textContent = '💾 حفظ التعديلات';
  $('cancelEditBtn').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.deleteProduct = async (id) => {
  if (!confirm("حذف هذا المنتج نهائيًا؟")) return;
  try {
    await deleteDoc(doc(db, "products", id));
    showToast("🗑️ تم الحذف");
  } catch(e){
    showToast("❌ فشل الحذف", "error");
  }
};

onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), snap => {
  allOrders = [];
  snap.forEach(d => allOrders.push({ id: d.id, ...d.data() }));

  if (!isFirstLoad && allOrders.length > previousOrdersCount){
    playNotificationSound();
    showToast("🔔 وصل طلب جديد!");
  }
  previousOrdersCount = allOrders.length;
  isFirstLoad = false;

  renderOrders();
  updateStats();
});

function renderOrders(){
  const search = ($('searchOrders').value || '').toLowerCase();
  const filterStatus = $('filterStatus').value;

  const filtered = allOrders.filter(o => {
    const matchSearch = !search ||
      (o.customerName || '').toLowerCase().includes(search) ||
      (o.customerPhone || '').includes(search) ||
      (o.productName || '').toLowerCase().includes(search);
    const matchStatus = !filterStatus || o.status === filterStatus;
    return matchSearch && matchStatus;
  });

  const customersMap = {};
  filtered.forEach(o => {
    const phone = o.customerPhone || 'unknown';
    if (!customersMap[phone]){
      customersMap[phone] = {
        name: o.customerName || 'غير معروف',
        phone,
        address: o.customerAddress || '-',
        items: []
      };
    }
    customersMap[phone].items.push(o);
  });

  if (!Object.keys(customersMap).length){
    $('adminOrdersTable').innerHTML = `<tr><td colspan="6" style="text-align:center">لا توجد طلبات</td></tr>`;
    $('adminOrdersMobile').innerHTML = `<div style="text-align:center;padding:20px;color:#888">لا توجد طلبات</div>`;
    return;
  }

  const statusLabels = { confirmed:'تأكيد', shipped:'جاري التوصيل', delivered:'تم التوصيل' };
  const statusColors = { confirmed:'#dbeafe', shipped:'#fed7aa', delivered:'#d1fae5' };

  $('adminOrdersTable').innerHTML = Object.keys(customersMap).map(phone => {
    const c = customersMap[phone];
    let total = 0;
    let productsHtml = '';
    const ids = [];
    c.items.forEach(item => {
      total += (item.price || 0) * (item.quantity || 1);
      ids.push(item.id);
      const qty = item.quantity > 1 ? ` (${item.quantity})` : '';
      productsHtml += `<span class="order-badge">📦 ${escapeHtml(item.productName || '')}${qty}</span>`;
    });
    const status = c.items[0].status || 'confirmed';

    let extras = '';
    c.items.forEach(item => {
      if (item.giftMessage) extras += `<div style="font-size:.72rem;color:var(--success-color);margin-top:4px">🎁 ${escapeHtml(item.giftMessage)}</div>`;
      if (item.selectedOptions) extras += Object.entries(item.selectedOptions).map(([k,v]) => `<span style="font-size:.7rem;background:var(--pink-soft);color:#582f0e;padding:2px 6px;border-radius:4px;margin-inline-end:4px">${escapeHtml(k)}: ${escapeHtml(v)}</span>`).join('');
    });

    return `<tr>
      <td><strong>${escapeHtml(c.name)}</strong>${extras}</td>
      <td>${escapeHtml(c.phone)}</td>
      <td>${productsHtml}</td>
      <td><strong style="color:var(--primary-color)">${total.toFixed(1)}ج</strong></td>
      <td>
        <select onchange="updateOrderStatus('${ids.join(',')}', this.value)" style="padding:4px 8px;border-radius:6px;border:1px solid var(--border-color);font-size:.75rem;font-weight:700;background:${statusColors[status]};color:#333">
          ${Object.entries(statusLabels).map(([k,v]) => `<option value="${k}" ${status===k?'selected':''}>${v}</option>`).join('')}
        </select>
      </td>
      <td>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn-whatsapp-sm" onclick="confirmViaWhatsApp('${escapeHtml(phone)}')" title="تأكيد الطلب عبر واتساب">💬 تأكيد</button>
          <a href="tel:${escapeHtml(c.phone)}" class="btn-call-sm" title="اتصال">📞</a>
          <button class="btn-danger-sm" onclick="deleteCustomerOrders(['${ids.join("','")}'])" title="حذف">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  $('adminOrdersMobile').innerHTML = Object.keys(customersMap).map(phone => {
    const c = customersMap[phone];
    let total = 0;
    let productsHtml = '';
    const ids = [];
    c.items.forEach(item => {
      total += (item.price || 0) * (item.quantity || 1);
      ids.push(item.id);
      const qty = item.quantity > 1 ? ` ×${item.quantity}` : '';
      productsHtml += `<div style="padding:4px 0;font-size:.82rem">📦 ${escapeHtml(item.productName || '')}${qty}</div>`;
    });
    const status = c.items[0].status || 'confirmed';

    return `<div class="mobile-card">
      <div style="font-weight:900;color:var(--primary-color);margin-bottom:6px">👤 ${escapeHtml(c.name)}</div>
      <div class="mobile-card-row"><span>📞 الهاتف:</span><strong>${escapeHtml(c.phone)}</strong></div>
      <div class="mobile-card-row"><span>📍 العنوان:</span><strong style="font-size:.75rem">${escapeHtml(c.address)}</strong></div>
      <div style="margin:6px 0">${productsHtml}</div>
      <div class="mobile-card-row"><span>💰 الإجمالي:</span><strong style="color:var(--primary-color)">${total.toFixed(1)}ج</strong></div>
      <div style="margin-top:6px">
        <select onchange="updateOrderStatus('${ids.join(',')}', this.value)" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--border-color);font-size:.8rem;font-weight:700;background:${statusColors[status]};color:#333;margin-bottom:6px">
          ${Object.entries(statusLabels).map(([k,v]) => `<option value="${k}" ${status===k?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div class="mobile-card-actions">
        <button class="btn-whatsapp-confirm" onclick="confirmViaWhatsApp('${escapeHtml(phone)}')" style="flex:1 1 100%">💬 تأكيد عبر واتساب</button>
        <a href="tel:${escapeHtml(c.phone)}" class="btn-call-sm" style="flex:1;text-align:center">📞 اتصال</a>
        <button class="btn-danger-sm" onclick="deleteCustomerOrders(['${ids.join("','")}'])" style="flex:1">🗑️ حذف</button>
      </div>
    </div>`;
  }).join('');
}

$('searchOrders').addEventListener('input', renderOrders);
$('filterStatus').addEventListener('change', renderOrders);

window.updateOrderStatus = async (idsStr, newStatus) => {
  const ids = idsStr.split(',');
  try {
    await Promise.all(ids.map(id => updateDoc(doc(db, "orders", id), { status: newStatus })));
    showToast("✅ تم تحديث الحالة");
    // إعادة الرسم لتحديث اللون
    setTimeout(renderOrders, 300);
  } catch(e){
    showToast("❌ خطأ", "error");
  }
};

window.deleteCustomerOrders = async (ids) => {
  if (!confirm("حذف طلبات هذا العميل؟")) return;
  try {
    await Promise.all(ids.map(id => deleteDoc(doc(db, "orders", id))));
    showToast("🗑️ تم الحذف");
  } catch(e){
    showToast("❌ خطأ", "error");
  }
};

/* ============ تأكيد الطلب عبر واتساب ============ */
window.confirmViaWhatsApp = (phone) => {
  // جمع كل طلبات هذا العميل
  const customerOrders = allOrders.filter(o => o.customerPhone === phone);
  if (!customerOrders.length) return showToast("لا توجد طلبات لهذا العميل", "error");

  const customer = {
    name: customerOrders[0].customerName || 'عميلنا العزيز',
    phone: phone,
    address: customerOrders[0].customerAddress || '-'
  };

  // بناء قائمة المنتجات
  let itemsList = '';
  let total = 0;
  customerOrders.forEach((o, i) => {
    const price = (o.price || 0) * (o.quantity || 1);
    total += price;
    const qty = o.quantity > 1 ? ` ×${o.quantity}` : '';
    itemsList += `${i+1}. ${o.productName}${qty} — ${price.toFixed(1)} ج\n`;
  });

  // بناء الرسالة
  const message =
`🌸 *متجر وِدّ* 🌸
━━━━━━━━━━━━━━━
مرحباً ${customer.name} 💐

تم استلام طلبك بنجاح ✅
وجاري تجهيزه بعناية 🌷

📋 *تفاصيل الطلب:*
${itemsList}
━━━━━━━━━━━━━━━
💰 *الإجمالي:* ${total.toFixed(1)} ج
📍 *العنوان:* ${customer.address}
━━━━━━━━━━━━━━━

سيتم التواصل معك قريباً لتأكيد موعد التوصيل 🚚

شكراً لثقتك بنا ❤️
*متجر وِدّ* — أجمل الورد والتحف الفنية`;

  // تنظيف رقم الهاتف
  let cleanPhone = phone.replace(/\D/g, '');
  if (cleanPhone.startsWith('0')) cleanPhone = '2' + cleanPhone; // 20 لمصر
  if (!cleanPhone.startsWith('20') && cleanPhone.length === 10) cleanPhone = '20' + cleanPhone;

  const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
  window.open(waUrl, '_blank');
};

$('clearAllOrdersBtn').addEventListener('click', async () => {
  if (!confirm("⚠️ مسح جميع الطلبات نهائيًا؟")) return;
  try {
    const snap = await getDocs(collection(db, "orders"));
    await Promise.all(snap.docs.map(d => deleteDoc(doc(db, "orders", d.id))));
    showToast("🗑️ تم مسح جميع الطلبات");
  } catch(e){
    showToast("❌ خطأ", "error");
  }
});

function updateStats(){
  $('statProducts').textContent = allProducts.length;
  const uniqueCustomers = new Set(allOrders.map(o => o.customerPhone)).size;
  $('statOrders').textContent = allOrders.length;
  $('statCustomers').textContent = uniqueCustomers;
  const revenue = allOrders.reduce((sum, o) => sum + (o.price || 0) * (o.quantity || 1), 0);
  $('statRevenue').textContent = revenue.toFixed(0) + 'ج';
  $('ordersCount').textContent = allOrders.length;
}

$('openOrdersBtn').addEventListener('click', () => $('ordersModalOverlay').classList.add('open'));
$('closeOrdersBtn').addEventListener('click', () => $('ordersModalOverlay').classList.remove('open'));
$('ordersModalOverlay').addEventListener('click', e => {
  if (e.target === $('ordersModalOverlay')) $('ordersModalOverlay').classList.remove('open');
});
